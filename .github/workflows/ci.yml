# Lightweight formula-tap CI for Ryan-AI-Studios/homebrew-tap.
# Does not require a full brew install matrix (macOS Apple Silicon smoke is
# documented for manual / post-release verification). Validates structure
# that release bump automation depends on.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formula-guard:
    name: Formula structure + checksum pin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Require root ledgerful.rb (not Formula/)
        shell: bash
        run: |
          set -euo pipefail
          test -f ledgerful.rb
          if [[ -e Formula/ledgerful.rb ]]; then
            echo "ERROR: Formula/ledgerful.rb must not exist; release bump pushes root ledgerful.rb only"
            exit 1
          fi
          if [[ -d Formula ]]; then
            echo "ERROR: Formula/ directory is not used by this tap (root formula only)"
            exit 1
          fi

      - name: Parse version + sha256 pins
        id: formula
        shell: bash
        run: |
          set -euo pipefail
          # version "X.Y.Z"
          version="$(grep -E '^\s*version "' ledgerful.rb | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "ERROR: could not parse version from ledgerful.rb (got: ${version:-empty})"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Parsed version: $version"

          # Collect sha256 lines (must be 64 hex chars each)
          mapfile -t hashes < <(grep -E '^\s*sha256 "' ledgerful.rb | sed -E 's/.*"([0-9a-f]{64})".*/\1/')
          if [[ "${#hashes[@]}" -lt 3 ]]; then
            echo "ERROR: expected ≥3 sha256 pins (arm64 macOS, intel macOS, linux); got ${#hashes[@]}"
            exit 1
          fi
          for h in "${hashes[@]}"; do
            if [[ ! "$h" =~ ^[0-9a-f]{64}$ ]]; then
              echo "ERROR: invalid sha256: $h"
              exit 1
            fi
            echo "  ok $h"
          done

          # Every release URL must match the formula version
          while IFS= read -r url; do
            if [[ "$url" != *"/v${version}/"* ]]; then
              echo "ERROR: url does not match version $version: $url"
              exit 1
            fi
            echo "  url $url"
          done < <(grep -E '^\s*url "' ledgerful.rb | sed -E 's/.*"([^"]+)".*/\1/')

      - name: Verify published checksum sidecars match formula pins
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.formula.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"

          # Extract (url, sha256) pairs in declaration order by scanning the file
          urls=()
          hashes=()
          while IFS= read -r line; do
            if [[ "$line" =~ url\ \"([^\"]+)\" ]]; then
              urls+=("${BASH_REMATCH[1]}")
            fi
            if [[ "$line" =~ sha256\ \"([0-9a-f]{64})\" ]]; then
              hashes+=("${BASH_REMATCH[1]}")
            fi
          done < ledgerful.rb

          if [[ "${#urls[@]}" -ne "${#hashes[@]}" ]]; then
            echo "ERROR: url count (${#urls[@]}) != sha256 count (${#hashes[@]})"
            exit 1
          fi

          mkdir -p /tmp/sha
          for i in "${!urls[@]}"; do
            url="${urls[$i]}"
            want="${hashes[$i]}"
            base="$(basename "$url")"
            asset="${base}.sha256"
            echo "Checking $asset against pin $want"
            # Download only the published .sha256 sidecar (authoritative)
            if ! gh release download "$tag" \
              --repo Ryan-AI-Studios/Ledgerful \
              --pattern "$asset" \
              --dir /tmp/sha \
              --clobber; then
              echo "ERROR: failed to download $asset for tag $tag"
              exit 1
            fi
            # First field of sha256sum-style file
            got="$(awk '{print $1; exit}' "/tmp/sha/$asset")"
            if [[ "$got" != "$want" ]]; then
              echo "ERROR: formula pin mismatch for $base"
              echo "  formula: $want"
              echo "  published: $got"
              exit 1
            fi
            echo "  match $base"
          done
          echo "All formula sha256 pins match published ${tag} checksums."

      - name: Formula install-body contract (source)
        # C4-style guard on live formula: dual-glob install, no broken Dir[] form.
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'Pathname.glob(buildpath' ledgerful.rb; then
            echo "ERROR: ledgerful.rb install must use Pathname.glob(buildpath…"
            exit 1
          fi
          if grep -q 'Dir\["ledgerful-' ledgerful.rb; then
            echo "ERROR: ledgerful.rb must not use Dir[\"ledgerful-…\"] install glob"
            exit 1
          fi
          if command -v ruby >/dev/null 2>&1; then
            ruby -c ledgerful.rb
          else
            echo "WARN: ruby not on PATH; skipped ruby -c"
          fi

      - name: Linux archive layout + staging + dual-glob smoke
        # 1) Archive nesting (packaging truth): tar has ledgerful-{target}/ledgerful
        # 2) B4 staging: sole top-level ledgerful-* dir models brew buildpath
        # 3) C2: same Pathname.glob dual resolve as formula install() against STAGE
        # Real `brew install` is job brew-install-smoke (required when Linuxbrew
        # bootstrap works). Apple Silicon remains a manual external gate.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.formula.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          asset="ledgerful-x86_64-unknown-linux-gnu.tar.gz"
          rm -rf /tmp/archive
          mkdir -p /tmp/archive
          gh release download "$tag" \
            --repo Ryan-AI-Studios/Ledgerful \
            --pattern "$asset" \
            --dir /tmp/archive \
            --clobber
          # Verify published sidecar still matches the file we will extract
          want="$(grep -A1 "url \".*${asset}\"" ledgerful.rb | grep sha256 | sed -E 's/.*"([0-9a-f]{64})".*/\1/')"
          got="$(sha256sum "/tmp/archive/${asset}" | awk '{print $1}')"
          if [[ "$got" != "$want" ]]; then
            echo "ERROR: downloaded archive hash mismatch"
            echo "  formula: $want"
            echo "  file:    $got"
            exit 1
          fi
          tar -xzf "/tmp/archive/${asset}" -C /tmp/archive

          # --- Archive nesting (packaging truth) ---
          archive_binary="$(find /tmp/archive -type f -path '*/ledgerful-*/ledgerful' | sort | head -n1)"
          if [[ -z "${archive_binary}" ]]; then
            echo "ERROR: nested ledgerful-*/ledgerful binary not found in archive"
            find /tmp/archive -maxdepth 3 -type f | head -n 50
            exit 1
          fi
          echo "archive nested binary: $archive_binary"

          # --- B4: brew-like staging (exactly one top-level ledgerful-* dir) ---
          mapfile -t stages < <(find /tmp/archive -maxdepth 1 -mindepth 1 -type d -name 'ledgerful-*' | sort)
          if [[ "${#stages[@]}" -ne 1 ]]; then
            echo "ERROR: expected exactly 1 top-level ledgerful-* stage dir, got ${#stages[@]}"
            find /tmp/archive -maxdepth 2 | head -n 50
            exit 1
          fi
          STAGE="${stages[0]}"
          echo "STAGE (buildpath model): $STAGE"
          if [[ ! -f "$STAGE/ledgerful" ]]; then
            echo "ERROR: staged binary missing at $STAGE/ledgerful"
            ls -la "$STAGE" || true
            exit 1
          fi
          chmod +x "$STAGE/ledgerful"
          out="$("$STAGE/ledgerful" --version)"
          echo "staged version: $out"
          if [[ "$out" != *"$VERSION"* ]]; then
            echo "ERROR: --version output does not contain $VERSION: $out"
            exit 1
          fi

          # --- C2: dual-glob mirror of formula install() against STAGE ---
          export STAGE
          ruby -e '
            require "pathname"
            stage = Pathname.new(ENV.fetch("STAGE"))
            binary = Pathname.glob(stage/"ledgerful").first ||
                     Pathname.glob(stage/"ledgerful-*/ledgerful").first
            if binary.nil?
              children = begin
                Dir.children(stage).sort.join(", ")
              rescue StandardError
                "(unreadable)"
              end
              abort "ERROR: dual-glob resolve failed under STAGE=#{stage} (children: #{children})"
            end
            unless binary.file?
              abort "ERROR: dual-glob resolved non-file: #{binary}"
            end
            puts "resolved: #{binary}"
          '

      - name: Require license files
        shell: bash
        run: |
          set -euo pipefail
          test -f LICENSE
          test -f COMMERCIAL-EXCEPTION.md
          test -f README.md
          # license :cannot_represent is required for PolyForm NC packaging
          grep -q 'license :cannot_represent' ledgerful.rb
          # quarantine interim guidance must stay visible
          grep -q 'xattr -d com.apple.quarantine' ledgerful.rb
          grep -q 'xattr -d com.apple.quarantine' README.md

  # C1: real brew install under Linuxbrew. Required when infra allows; models
  # Homebrew AbstractDownloadStrategy#chdir + Formula#stage for real. Uses
  # Homebrew/actions/setup-homebrew. If this job flakes on bootstrap only,
  # formula-guard (staging + C2) remains the hard install-contract gate.
  brew-install-smoke:
    name: brew install smoke (Linuxbrew)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Parse formula version
        id: formula
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -E '^\s*version "' ledgerful.rb | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "ERROR: could not parse version from ledgerful.rb (got: ${version:-empty})"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@fd832223f9f99ebf0244dd20658680e5d4aca049 # 2026.08.03.2

      - name: Install formula (real brew stage + install)
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_FROM_API: "1"
          VERSION: ${{ steps.formula.outputs.version }}
        run: |
          set -euo pipefail
          # Homebrew rejects bare ./ledgerful.rb ("must be in a tap"). Seed a
          # local CI tap with this PR's formula (root layout matches live tap).
          # Prebuilt release URL formula — brew downloads tar, stages sole top
          # dir as buildpath, then runs install(). This is the only CI path that
          # executes formula Ruby under real Homebrew chdir.
          brew tap-new --no-git local/ledgerful-ci
          TAP_DIR="$(brew --repository local/ledgerful-ci)"
          # tap-new scaffolds Formula/; live tap uses root formula — copy both
          # so either layout resolves (prefer root for lockstep with live).
          cp ledgerful.rb "${TAP_DIR}/ledgerful.rb"
          cp ledgerful.rb "${TAP_DIR}/Formula/ledgerful.rb"
          brew install --formula local/ledgerful-ci/ledgerful
          out="$(ledgerful --version)"
          echo "ledgerful --version: $out"
          if [[ "$out" != *"$VERSION"* ]]; then
            echo "ERROR: installed binary --version does not contain $VERSION: $out"
            exit 1
          fi
          brew test local/ledgerful-ci/ledgerful
          echo "brew install smoke OK"
